<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161616">
  <title>404 — Metisor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,500;6..144,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #9a9a9a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Google Sans Flex", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(900px, 100%);
      min-height: 100vh;
      padding: 42px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .wordmark {
      position: absolute;
      top: 36px;
      left: 36px;
      width: 150px;
      height: auto;
      filter: brightness(0) invert(1);
      opacity: .92;
    }

    .code {
      margin: 0;
      font-size: clamp(120px, 22vw, 240px);
      line-height: .8;
      font-weight: 500;
      letter-spacing: 0.045em;
    }

    h1 {
      margin: 34px 0 0;
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    @media (max-width: 600px) {
      main { padding: 32px 24px; }
      .wordmark { top: 24px; left: 24px; width: 125px; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/Website/MetisorWordmark.png" alt="Metisor">
    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
  </main>
</body>
</html>
